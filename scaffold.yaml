# yaml-language-server: $schema=https://hay-kot.github.io/scaffold/schema.json
metadata:
  minimum_version: v0.6.1
messages:
  pre: |
    # Go Package Scaffold

    Generate boilerplate for a new Go library package.

  post: |
    # Get Started

    ```sh
    cd {{ .ProjectKebab }}
    mise run check
    ```
skip:
  - "*mise.toml"

questions:
  - name: "gomod"
    group: "default"
    prompt:
      message: "Go Module Path"
      description: "e.g. github.com/username/project"
  - name: "full_name"
    group: "default"
    prompt:
      message: "Developers Name"
      description: "For License and README"
    required: true
  - name: "description"
    group: "default"
    prompt:
      message: "Description"
      description: "A short description of the package"
      multi: true
    required: true
  - name: "open_source_license"
    group: "default"
    prompt:
      message: "License"
      description: "Choose a license for your project"
      default: "MIT license"
      options:
        - "MIT license"
        - "BSD license"
        - "ISC license"
        - "Apache Software License 2.0"
        - "GNU General Public License v3"

  - name: "features_cicd"
    group: "features"
    prompt:
      message: "CI/CD"
      description: "Select CI/CD features to enable"
      multi: true
      default: ["Github Actions", "Renovate", "Goreleaser"]
      options:
        - "Github Actions"
        - "Renovate"
        - "Goreleaser"

computed:
  feature_gh_actions: '{{ has "Github Actions" .Scaffold.features_cicd }}'
  feature_renovate: '{{ has "Renovate" .Scaffold.features_cicd }}'
  feature_goreleaser: '{{ has "Goreleaser" .Scaffold.features_cicd }}'

presets:
  test:
    Project: "pkg-test"
    gomod: "github.com/username/project"
    full_name: "John Doe"
    description: "A new package"
    open_source_license: "MIT license"
    features_cicd:
      - "Github Actions"
      - "Renovate"
      - "Goreleaser"

delimiters:
  # goreleaser configs and release workflows use Go templates themselves;
  # override the scaffold delimiters so the two don't collide.
  - glob: "*.goreleaser.yml"
    left: "[["
    right: "]]"
  - glob: "**/workflows/publish.yml"
    left: "[["
    right: "]]"

features:
  - value: "{{ .Computed.feature_renovate }}"
    globs:
      - "**/renovate.json"
  - value: "{{ .Computed.feature_gh_actions }}"
    globs:
      - "**/workflows/**.yml"
  - value: "{{ .Computed.feature_goreleaser }}"
    globs:
      - "**/.goreleaser.yml"
      - "**/workflows/publish.yml"
