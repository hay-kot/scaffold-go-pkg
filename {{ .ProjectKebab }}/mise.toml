[tools]
go = "latest"
golangci-lint = "latest"
# [[- if .Computed.feature_goreleaser ]]
goreleaser = "latest"
# [[- end ]]
# [[- if .Computed.feature_lefthook ]]
lefthook = "latest"
# [[- end ]]

[env]
LOG_LEVEL = "debug"

[tasks.test]
description = "Run all go tests"
run = "go test ./..."

[tasks.coverage]
description = "Run tests with race detection and coverage"
run = "go test -race -coverprofile=coverage.out -covermode=atomic ./... -v -cover"

[tasks.tidy]
description = "Run go mod tidy"
run = "go mod tidy"

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.fmt]
description = "Run golangci-lint fmt"
run = "golangci-lint fmt"

[tasks.check]
description = "Run all checks for PRs (tidy, lint, test)"
run = [
    { task = "tidy" },
    { task = "lint" },
    { task = "test" },
]
